<form id="mediumForm">
    <fieldset>
        <h4>Configure TranslateYourReviews</h4>
        <p>
            Before using TranslateYourReviews, it is necessary that you provide your own DeepL
            API key. You can get one for free by signing up
            <a href="https://www.deepl.com/en/pro#api" target="_blank">here</a>
        </p>

        <br />

        <div class="clear">
            <label id="api-usage-label" style="width: 100%;">API usage</label>
            <progress id="progressBar" value="0" max="100" style="width: 100%;" />
        </div>
        <!-- <br /> -->

        <label class="first" for="api-key">
            DeepL API key
            <input id="api-key" />
        </label>
        <div class="clear"></div>

        <br />
        <input type="button" value="Update configuration" id="tyr-configuration-done" />
    </fieldset>
</form>
